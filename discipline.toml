[meta]
version = 1
name = "php-judy"
description = "PHP extension wrapping libJudy"

[directives]
sources = ["pr-body", "commits", "merged-pr-body"]

[languages.c]
# Project macros written without a semicolon; the Zend ones are built in.
macros = ["JUDY_METHOD_GET_OBJECT", "JUDY_ITERATOR_GET_OBJECT", "CHECK_ARRAY_AND_ARG_TYPE", "PHP_JUDY_API", "JSLN", "JLN"]

# ── Agent & AST Test Protection ──────────────────────────────────────────
[gates.agents-md]
enabled = false # CLAUDE.md is a 59-line quick reference; AGENTS.md is the 400-line full guide

[gates.assertion-reduction]
enabled = true

[gates.vacuous-tests]
enabled = true

[gates.ignored-tests]
enabled = true

[gates.test-floor]
enabled = true

[gates.deletion-rationale]
enabled = true

[gates.error-swallowing]
# Debugger printers probe optional symbols; benchmark scripts clean up best-effort.
exempt_paths = ["scripts/judy_gdb.py", "scripts/judy_lldb.py", "scripts/bench-*.php"]

# ── Repository Hygiene ───────────────────────────────────────────────────
[gates.pii]
enabled = true
exempt_paths = [
    "examples/ip-range-lookup.php", # Legitimate CIDR fixture with RFC 1918 example IP
]

[gates.time-estimates]
enabled = true
diff_only = true

[gates.agent-scratch]
enabled = true

[gates.provenance-tags]
enabled = true
diff_only = true
# BENCHMARK.md and examples carry measured numbers; require (measured|target|projected) tags.

# ── CI & Packaging Integrity ─────────────────────────────────────────────
[gates.ci-integrity]
enabled = true
pin_actions = false # php-judy CI pins official actions by tag (@v4, @v2)
rollup_job = "ci-gate"

[gates.ci-skip-set]
# ci-gate passes `toJson(needs)`: every PR-narrowed job must be skipped exactly
# when its `if:` reads false from the detect-changes outputs (#214).
enabled = true
workflow = ".github/workflows/ci.yml"
change_job = "detect-changes"
unconditional_jobs = ["detect-changes", "discipline"]

[gates.version-lockstep]
enabled = true
[[gates.version-lockstep.groups]]
name = "pecl-release"
sources = [
    { path = "php_judy.h", regex = '#define\s+PHP_JUDY_VERSION\s+"([^"]+)"' },
    { path = "package.xml", regex = '<release>([^<]+)</release>' },
]

[gates.manifest-sync]
enabled = true
[[gates.manifest-sync.rules]]
manifest = "package.xml"
extract_regex = '<file\s+[^>]*name="([^"]+)"'
watched_paths = [
    "tests/**",
    "libjudy/**",
]
exclude_paths = [
    "libjudy/.gitattributes",
]

[gates.archive-contents]
enabled = false # Enabled dynamically in packaging job via --enable archive-contents
archive_path = "Judy-*.tgz"
strip_components = 1
required_paths = [
    "config.m4",
    "php_judy.h",
]
forbidden_patterns = [
    "^tools/",
    "^research/",
    "\\.git",
    "\\.DS_Store",
]

# ── Benchmark & Performance Integrity ─────────────────────────────────────
[gates.golden-output]
enabled = true
paths = [
    "**/golden/**",
    "**/snapshots/**",
    "**/__snapshots__/**",
    "**/*.snap",
    "**/*.ambr",
    "**/*.golden",
    "**/*.approved.*",
    "tests/fixtures/**/output*",
    "baselines/**",
]

[gates.bench-regression]
enabled = true
tolerance_pct = 0.5
paths = [
    "target/iai/**",
    "**/callgrind.*",
    "target/criterion/**",
    "**/*bench*.json",
    "**/*bench*.log",
    "**/*bench*.txt",
    "baselines/latest.json",
]

# ── Verification (intentionally off for this project) ────────────────────
# sanitizers: discipline's gate is Rust/Cargo-oriented (nightly toolchain) and
# has no command hook for a C/PHP extension build. Memory safety for the C side
# is covered by a dedicated CI job instead (see issue/PR notes).
# [gates.sanitizers]
# enabled = false

# command: would duplicate the make test run on every discipline check and slow
# local/PR checks; test-floor already ratchets test counts. Revisit if a cheap
# smoke command is wanted.
# [gates.command]
# enabled = false

# citation-metadata: no CITATION.cff/.zenodo.json; enable only if a Zenodo DOI
# or academic citation record is desired for releases.
# [gates.citation-metadata]
# enabled = false

# agents-md: CLAUDE.md is a short quick reference, AGENTS.md is the full guide.
