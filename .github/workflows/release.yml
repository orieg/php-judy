name: Publish Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  # Ensure the Git release tag matches the version declared in package.xml
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate tag matches package.xml version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          PKG_VERSION=$(php -r "
            \$xml = simplexml_load_file('package.xml');
            echo (string)\$xml->version->release;
          ")
          TAG_VERSION="${TAG#v}"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "ERROR: Release tag '$TAG' (version '$TAG_VERSION') does not match package.xml version '$PKG_VERSION'"
            echo "Update package.xml <release> to '$TAG_VERSION' before publishing."
            exit 1
          fi
          echo "OK: tag '$TAG' matches package.xml version '$PKG_VERSION'"

  # Dynamically generate the Windows build matrix from package.xml / PHP defaults
  get-extension-matrix:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.extension-matrix.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Get the extension matrix
        id: extension-matrix
        uses: php/php-windows-builder/extension-matrix@v1
        with:
          # The action defaults to arch-list "x64,x86". The bundled libJudy
          # is 64-bit-only -- its pre-generated Judy1Tables.c/JudyLTables.c
          # assume JU_64BIT -- so config.w32 hard-fails a 32-bit configure.
          # Left unconstrained, every x86 leg would fail and (with the
          # default fail-fast) take the whole release down, publishing no
          # DLLs at all. x64 is what this project supports and tests; keep
          # this list in sync with ci.yml's build-windows matrix.
          arch-list: x64

  # Build Windows DLLs for every PHP version / thread-safety combination (x64)
  build-windows:
    needs: get-extension-matrix
    runs-on: ${{ matrix.os }}
    strategy:
      matrix: ${{fromJson(needs.get-extension-matrix.outputs.matrix)}}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      # The bundled libJudy (libjudy/) builds via config.w32, and the P5 LLP64
      # patches are real source diffs now — the historical SourceForge
      # download + regex-patch step (and its patch-set-drift hazard, #143) is
      # gone (issue #142).
      - name: Build the extension
        uses: php/php-windows-builder/extension@v1
        with:
          php-version: ${{ matrix.php-version }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          # Skip tests during release — they are already gated by the CI workflow
          run-tests: 'false'

  # Build the PECL source package (.tgz) for Linux / manual installs
  pecl-package:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Create PECL package
        run: pecl package package.xml

      - name: Upload PECL package artifact
        uses: actions/upload-artifact@v7
        with:
          name: pecl-package
          path: "*.tgz"

  # Attach all built artifacts to the GitHub Release
  release:
    runs-on: ubuntu-latest
    needs: [build-windows, pecl-package]
    if: ${{ github.event_name == 'release' }}
    steps:
      - name: Upload Windows DLLs to the release
        uses: php/php-windows-builder/release@v1
        with:
          release: ${{ github.event.release.tag_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download PECL package artifact
        uses: actions/download-artifact@v8
        with:
          name: pecl-package

      - name: Upload PECL package to the release
        run: gh release upload "${{ github.event.release.tag_name }}" Judy-*.tgz --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
