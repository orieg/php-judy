name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Only the newest commit of a pull request gets CI. Pushing a new commit (or a
# force-push during a rebase) cancels the run for the commit it replaces: that
# run's verdict describes code that no longer exists, so finishing it buys
# nothing and costs a runner slot. Actions concurrency is an account-wide pool
# shared with this owner's other repositories, and one full CI run here is 22
# jobs -- enough on its own to saturate it -- so a superseded run is not merely
# wasted, it delays the run that replaced it and every other repo's queue with
# it. Measured on 2026-08-19: 9 of 28 pull-request runs were superseded, 25% of
# the day's CI job-minutes went to results nobody could read, and median job
# queue delay rose from 0.1 min (2026-08-18) to 3.5 min, p90 21 min.
#
# push:main is deliberately NOT cancellable. Those runs are the project's
# historical record and feed the release path; a main run must always finish
# even if the next merge lands while it is in flight. Two things enforce that
# independently, on purpose:
#   - the group key falls back to github.sha outside a pull request
#     (github.event.pull_request.number is empty there), so every main commit
#     gets its own group and main runs neither cancel nor queue behind another;
#   - cancel-in-progress is switched off outright for non-pull_request events.
#
# github.workflow is part of the key so this never reaches across workflows:
# a CI run and the Benchmark Gate's own "bench-gate-<ref>" group on the same
# ref are separate groups and cannot cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  checks: write
  pull-requests: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    # Experimental (pre-release) PHP versions may fail without blocking CI.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      matrix:
        php-version: ["8.1", "8.2", "8.3", "8.4", "8.5"]
        include:
          # PHP 8.6 is pre-release (nightly build via setup-php); make it
          # required once 8.6 reaches RC/GA.
          - php-version: "8.6"
            experimental: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none

      - name: Build the extension
        # No --with-judy: the bundled libJudy (libjudy/) is the default build,
        # so this job also proves the tree builds with no system libJudy at all.
        run: |
          phpize
          ./configure
          # Fail the build on any compiler warning (captured to a log so the
          # next step can gate on it). The extension is expected to compile
          # cleanly; a new warning is usually a real portability/UB signal.
          #
          # pipefail matters here: without it the pipeline reports tee's exit
          # status, so a compile ERROR passes this step and only resurfaces
          # later when "Run tests" rebuilds -- reported as a test failure.
          set -o pipefail
          make 2>&1 | tee /tmp/build.log

      - name: Fail on compiler warnings
        run: |
          # Only gate on real compiler warnings in our own source files
          # (form "<file>.c:<line>:<col>: warning:"). Ignore unrelated noise
          # such as autoconf's AC_PROG_LIBTOOL-obsolete and the LTO
          # lto-wrapper "serial compilation" notes.
          # The vendored libjudy/ sources are deliberately excluded: third-party
          # code at -Wall warns copiously, and patch hygiene (libjudy/PATCHES.md)
          # beats chasing upstream warnings.
          if grep -E '(php_judy|judy_handlers|judy_arrayaccess|judy_iterator)\.[ch]:[0-9]+:[0-9]+: warning:' /tmp/build.log; then
            echo "::error::Compiler warnings detected in extension sources — see log above"
            exit 1
          fi
          echo "No compiler warnings in extension sources."

      - name: Run tests
        run: make test TESTS=tests/ NO_INTERACTION=1 REPORT_EXIT_STATUS=1 TEST_PHP_JUNIT=junit.xml

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-linux-${{ matrix.php-version }}
          path: junit.xml
          if-no-files-found: ignore

      - name: Verify API.md is up to date
        if: matrix.php-version == '8.4'
        run: php scripts/generate-api-docs.php --check

      - name: Install PIE
        if: matrix.php-version == '8.4'
        run: |
          curl -fsSL https://github.com/php/pie/releases/latest/download/pie.phar \
            -o /usr/local/bin/pie
          chmod +x /usr/local/bin/pie
          pie --version

      - name: Install previous-release baseline via PIE
        if: matrix.php-version == '8.4'
        run: |
          # Compare against the most recent stable release (release-over-
          # release regression detection). Bump this to the just-published
          # release on each release — see the "Releasing" section in README.
          #
          # The 2.5.2 baseline predates the vendored libJudy, so IT still
          # needs the system library; installed only now, after the bundled
          # build above already proved itself without one.
          sudo apt-get update && sudo apt-get install -y libjudy-dev
          sudo pie install --skip-enable-extension orieg/judy:2.5.2 \
            --with-judy=/usr
          BASELINE_SO="$(php-config --extension-dir)/judy.so"
          echo "BASELINE_SO=$BASELINE_SO" >> "$GITHUB_ENV"
          php -d "extension=$BASELINE_SO" -r \
            'echo "Baseline loaded: judy " . judy_version() . "\n";'

      - name: Run interleaved release comparison
        if: matrix.php-version == '8.4'
        run: |
          # Interleaved A/B/A/B comparison against the previous release. The
          # arms alternate per benchmark group and repeat over several rounds,
          # so runner drift hits both arms and cancels in the paired ratio —
          # see scripts/bench-compare.php and issue #87 for why running the
          # two suites back to back reported false regressions instead. A
          # pure-PHP control decides whether any residual run-wide shift is
          # runner movement (contaminated, flags suppressed) or a real
          # build-wide change (per-cell verdicts stand).
          #
          # Deliberately smaller than the headline benchmark below: this job
          # needs to detect *changes* reliably, not produce publishable
          # absolute numbers (those come from a dedicated host, see
          # BENCHMARK.md). Rounds buy more than element count here.
          php scripts/bench-compare.php \
            --baseline-so "$BASELINE_SO" \
            --current-so "$(pwd)/modules/judy.so" \
            --size 300000 --iterations 3 --rounds 5 \
            --out bench-compare.json \
            2>&1 | tee bench-compare-output.txt

      - name: Upload release comparison results
        if: always() && matrix.php-version == '8.4'
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-baseline-linux-php${{ matrix.php-version }}
          path: |
            bench-compare.json
            bench-compare-output.txt
          if-no-files-found: ignore

      - name: Run benchmarks
        run: |
          JUDY_SO="$(pwd)/modules/judy.so"
          mkdir -p /tmp/php-judy-ini
          echo "extension=$JUDY_SO" > /tmp/php-judy-ini/judy.ini

          # Unified benchmark: all suites, JSON output for cross-version comparison
          # --memory rss is the default; named here because it is what makes the
          # consolidated comment's memory table honest (issue #172). It costs one
          # child process per type per arm.
          PHP_INI_SCAN_DIR=/tmp/php-judy-ini php examples/benchmarks/judy-bench.php \
            --json bench.json --size 500000 --iterations 7 --suite all --memory rss \
            2>&1 | tee benchmark-output.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-linux-php${{ matrix.php-version }}
          path: |
            bench.json
            benchmark-output.txt
          if-no-files-found: ignore

  build-alpine:
    # Most containerized PHP runs on Alpine. musl differs from glibc enough
    # (allocator, default stack size, locale handling) that a clean Debian
    # build does not imply a clean musl one.
    #
    # Built through Docker on a glibc runner rather than as a `container:`
    # job: GitHub's node runtime for JS actions (actions/checkout) is
    # glibc-linked and does not execute inside an Alpine container.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build the extension on Alpine/musl
        run: docker build -f Dockerfile.alpine -t php-judy-alpine .

      - name: Run tests on Alpine/musl
        run: |
          docker run --rm -w /usr/src/php-judy php-judy-alpine \
            make test TESTS=tests/ NO_INTERACTION=1 REPORT_EXIT_STATUS=1

  debug-mirror-assertions:
    # Permanent system-lib guard: this job deliberately keeps installing
    # libjudy-dev and building --with-judy=/usr so the system-lib mode of
    # config.m4 stays exercised forever (issue #142). Everything else is CI
    # policy for the mirror assertions:
    #
    # The four *_HASH / *_ADAPTIVE types keep the key set in a JudySL
    # key_index and the values in a separate store. A path that updates one
    # and not the other produces two valid pointers holding different answers:
    # no crash, no leak, nothing valgrind can see. This job builds with
    # --enable-judy-debug-mirror, which compiles in a checker that walks both
    # stores and aborts on disagreement, and runs the whole suite under it.
    #
    # The last step is a negative control. An assertion that has never fired
    # is not known to work, and a harness that silently stops checking is
    # worse than none — so CI deletes one line the checker depends on and
    # requires the abort to happen.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Judy library
        run: sudo apt-get update && sudo apt-get install -y libjudy-dev

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Build with the consistency assertions
        run: |
          phpize
          ./configure --with-judy=/usr --enable-judy-debug-mirror
          make 2>&1 | tee /tmp/build-debug-mirror.log

      - name: Fail on compiler warnings
        run: |
          if grep -E '(php_judy|judy_handlers|judy_arrayaccess|judy_iterator)\.[ch]:[0-9]+:[0-9]+: warning:' /tmp/build-debug-mirror.log; then
            echo "::error::Compiler warnings detected with JUDY_DEBUG_MIRROR enabled"
            exit 1
          fi
          echo "No compiler warnings in extension sources."

      - name: Confirm the assertions are compiled in
        # Without this the job degrades silently into a duplicate of
        # build-linux the moment the configure flag stops taking effect.
        run: |
          nm -D --defined-only modules/judy.so | grep -q judy_debug_check_mirror \
            || { echo "::error::--enable-judy-debug-mirror produced a build with no checker in it"; exit 1; }

      - name: Run the full suite under the assertions
        run: make test TESTS=tests/ NO_INTERACTION=1 REPORT_EXIT_STATUS=1

      - name: Negative control — break the invariant, require the abort
        run: |
          # Delete the counter bump that accompanies a new key in the
          # key_index-backed types. The stores stay individually valid; only
          # their agreement breaks, which is exactly what the checker is for.
          sed -i 's|intern->counter++; /\* judy-mirror-negative-control \*/|/* deleted by the CI negative control */|' php_judy.c
          grep -q 'deleted by the CI negative control' php_judy.c \
            || { echo "::error::negative control did not apply — the anchor line in php_judy.c moved"; exit 1; }
          make

          set +e
          php -d extension="$(pwd)/modules/judy.so" \
            -r '$j = new Judy(Judy::STRING_TO_INT_HASH); $j["a"] = 1;' \
            > /tmp/negative-control.log 2>&1
          rc=$?
          set -e
          cat /tmp/negative-control.log

          if [ "$rc" -eq 0 ]; then
            echo "::error::a deliberately broken invariant ran to completion — the assertions are not working"
            exit 1
          fi
          grep -q 'MIRROR INVARIANT VIOLATED' /tmp/negative-control.log \
            || { echo "::error::process failed but not via the mirror assertion — check the log above"; exit 1; }
          echo "Negative control passed: the assertions caught the broken invariant."

          git checkout -- php_judy.c

      - name: Negative control — break the payload mirror, require the abort
        run: |
          # The population/counter control above cannot see a *stale* mirror:
          # both stores stay populated and the counter stays right, only the
          # two integers disagree. Delete the mirror write on the offsetSet
          # path and require the payload comparison to catch it.
          #
          # The instance must be constructed with optimizeIteration on: the
          # mirror is opt-in, and on a default instance the deleted line was
          # never going to run. That is also why the control below exists.
          sed -i 's|JUDY_LVAL_WRITE(mirror, lval); /\* judy-mirror-payload-negative-control \*/|/* deleted by the CI negative control */|' php_judy.c
          grep -q 'deleted by the CI negative control' php_judy.c \
            || { echo "::error::negative control did not apply — the anchor line in php_judy.c moved"; exit 1; }
          make

          set +e
          php -d extension="$(pwd)/modules/judy.so" \
            -r '$j = new Judy(Judy::STRING_TO_INT_HASH, true); $j["a"] = 1;' \
            > /tmp/negative-control-payload.log 2>&1
          rc=$?
          set -e
          cat /tmp/negative-control-payload.log

          if [ "$rc" -eq 0 ]; then
            echo "::error::a stale payload mirror ran to completion — the payload assertion is not working"
            exit 1
          fi
          grep -q 'mirrored payload' /tmp/negative-control-payload.log \
            || { echo "::error::process failed but not via the payload assertion — check the log above"; exit 1; }
          echo "Negative control passed: the assertions caught the stale mirror."

          # Same broken build, default-constructed instance: the deleted write
          # was gated off, so nothing should fire. If this aborts, the gate is
          # not a gate and "optimizeIteration defaults to off" is not true.
          set +e
          php -d extension="$(pwd)/modules/judy.so" \
            -r '$j = new Judy(Judy::STRING_TO_INT_HASH); $j["a"] = 1; echo $j["a"];' \
            > /tmp/negative-control-default.log 2>&1
          rc=$?
          set -e
          cat /tmp/negative-control-default.log
          if [ "$rc" -ne 0 ]; then
            echo "::error::a default-constructed instance depends on the mirror write — the opt-in gate leaks"
            exit 1
          fi

          git checkout -- php_judy.c

      - name: Negative control — write the mirror unconditionally, require the abort
        run: |
          # The mirror-off half of the invariant: on an instance that did not
          # ask for it, the key_index value word must still be the 0 that JSLI
          # left there. Drop the gate on the offsetSet mirror write so a
          # default-constructed array mirrors anyway, and require check (5) to
          # catch it. Without this control, "default off" is an intention
          # rather than a tested property — a leaked mirror write is two valid
          # words and passes every other check in the file.
          sed -i 's|if (mirror_out != NULL \&\& intern->mirror_payload) {|if (mirror_out != NULL) { /* gate removed by the CI negative control */|' php_judy.c
          grep -q 'gate removed by the CI negative control' php_judy.c \
            || { echo "::error::negative control did not apply — the anchor line in php_judy.c moved"; exit 1; }
          make

          set +e
          php -d extension="$(pwd)/modules/judy.so" \
            -r '$j = new Judy(Judy::STRING_TO_INT_HASH); $j["a"] = 1;' \
            > /tmp/negative-control-leak.log 2>&1
          rc=$?
          set -e
          cat /tmp/negative-control-leak.log

          if [ "$rc" -eq 0 ]; then
            echo "::error::a mirror write on an unmirrored instance ran to completion — check (5) is not working"
            exit 1
          fi
          grep -q 'does not mirror' /tmp/negative-control-leak.log \
            || { echo "::error::process failed but not via the unmirrored-slot assertion — check the log above"; exit 1; }
          echo "Negative control passed: the assertions caught the leaked mirror write."

          git checkout -- php_judy.c

  debug-php-assertions:
    # A --enable-debug PHP compiles in checks that a release build drops,
    # among them the arginfo cross-checks: zend_verify_internal_return_type
    # compares what an internal function returns against what its arginfo
    # declares, and the zpp bookkeeping catches a function whose parameter
    # parsing disagrees with its declared signature. No other job here runs
    # against such a PHP, and that gap is why Judy::offsetSet()/offsetUnset()
    # could be declared IS_VOID while returning a bool -- an abort on every
    # call under a debug build -- without CI noticing (#137).
    #
    # This job depends on the config.m4 fix that ships alongside it: PHP
    # normalises PHP_DEBUG from "yes" to 1 before an extension's config.m4
    # runs, so the old `!= "yes"` guard matched debug builds too and appended
    # -DNDEBUG, which Zend/zend_portability.h rejects with a hard #error.
    # Before that fix the extension could not be compiled against a debug PHP
    # at all.
    #
    # setup-php ships no --enable-debug builds, so the PHP is compiled from
    # source here and cached on its version.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Resolve the PHP 8.4 release to build
        run: |
          # Track the current 8.4 patch release so the assertions stay current,
          # and fall back to a known-good pin if the release feed changes
          # shape: the patch level is not what this job is testing, so a feed
          # hiccup should not turn the job red.
          FALLBACK=8.4.24
          VERSION=$(curl -fsSL --max-time 30 \
                      'https://www.php.net/releases/?json&version=8.4' \
                    | grep -oE '"version":"8\.4\.[0-9]+"' \
                    | grep -oE '8\.4\.[0-9]+' | head -1 || true)
          if [ -z "$VERSION" ]; then
            echo "::warning::could not resolve the current PHP 8.4 release — falling back to $FALLBACK"
            VERSION=$FALLBACK
          fi
          echo "PHP_DEBUG_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Debug PHP to build: $VERSION"

      - name: Restore the cached debug PHP
        id: php-debug-cache
        uses: actions/cache@v6
        with:
          path: ~/php-debug
          # The configure line is part of the key: a build made with different
          # flags is a different PHP and must not be reused.
          key: php-debug-${{ runner.os }}-${{ env.PHP_DEBUG_VERSION }}-enable-debug-disable-all-cli

      - name: Build PHP ${{ env.PHP_DEBUG_VERSION }} with --enable-debug
        if: steps.php-debug-cache.outputs.cache-hit != 'true'
        run: |
          # --disable-all keeps the build to what the suite actually needs:
          # json and pcre cannot be disabled and are the only extensions the
          # .phpt files use, and the whole suite runs under it with zero
          # skipped tests. Add an extension back here if a test starts
          # needing one, rather than enabling everything.
          curl -fsSL --retry 3 -o /tmp/php.tar.xz \
            "https://www.php.net/distributions/php-${PHP_DEBUG_VERSION}.tar.xz"
          tar -xf /tmp/php.tar.xz -C /tmp
          cd "/tmp/php-${PHP_DEBUG_VERSION}"
          ./configure --enable-debug --disable-all --enable-cli --without-pear \
            --prefix="$HOME/php-debug"
          make -j"$(nproc)"
          make install

      - name: Confirm the PHP really is a debug build
        run: |
          # Without this the job degrades into a slower duplicate of
          # build-linux the moment --enable-debug stops taking effect, and a
          # PHP with no assertions in it would make every step below pass
          # vacuously.
          "$HOME/php-debug/bin/php" -v
          "$HOME/php-debug/bin/php" -r 'var_dump(PHP_DEBUG);' | grep -qx 'bool(true)' \
            || { echo "::error::PHP_DEBUG is not true — this is not a debug PHP"; exit 1; }
          "$HOME/php-debug/bin/php" -i | grep -qE '^Debug Build => yes$' \
            || { echo "::error::php -i does not report a debug build"; exit 1; }
          echo "Confirmed: NTS DEBUG PHP ${PHP_DEBUG_VERSION}."

      - name: Build the extension against the debug PHP
        run: |
          # A phpize build inherits PHP_DEBUG from the installed PHP; pass
          # --enable-debug anyway so the intent does not rest on inheritance.
          "$HOME/php-debug/bin/phpize"
          # Bundled libJudy (no --with-judy); the vendored units keep their
          # own -O2 -fno-lto flags even in a debug build.
          ./configure --with-php-config="$HOME/php-debug/bin/php-config" \
            --enable-debug
          set -o pipefail
          make 2>&1 | tee /tmp/build-debug-php.log

      - name: Fail on compiler warnings
        run: |
          # Vendored libjudy/ sources deliberately excluded (see build-linux).
          if grep -E '(php_judy|judy_handlers|judy_arrayaccess|judy_iterator)\.[ch]:[0-9]+:[0-9]+: warning:' /tmp/build-debug-php.log; then
            echo "::error::Compiler warnings detected building against a debug PHP"
            exit 1
          fi
          echo "No compiler warnings in extension sources."

      - name: Confirm the extension loads into the debug PHP
        run: |
          # A module built for a release PHP cannot load into a debug one --
          # the build IDs differ -- so a successful load is also the proof
          # that the .so under test was compiled with ZEND_DEBUG on.
          "$HOME/php-debug/bin/php" -d extension="$(pwd)/modules/judy.so" \
            -r 'if (!PHP_DEBUG) { fwrite(STDERR, "not a debug runtime\n"); exit(1); }
                printf("judy %s loaded into a debug PHP\n", judy_version());'

      - name: Run the full suite on the debug PHP
        run: make test TESTS=tests/ NO_INTERACTION=1 REPORT_EXIT_STATUS=1

      # run-tests.php leaves tests/<name>.diff next to a failing .phpt, but the
      # job has never printed it, so a failure that reproduces only here has
      # been opaque from outside -- the debug PHP is a cached from-source build
      # and is not cheap to stand up locally just to read one diff. Print them.
      - name: Show the diff for any failing test
        if: failure()
        run: |
          shopt -s nullglob
          found=0
          for d in tests/*.diff; do
            found=1
            echo "::group::$d"
            head -c 8000 "$d"
            echo
            echo "::endgroup::"
          done
          [ "$found" = 1 ] || echo "no tests/*.diff produced"

      - name: Negative control — restore the mismatch, require the fatal
        run: |
          # The whole suite gates again now that Judy::__construct calls zpp
          # unconditionally, so the exclusion and the step that pinned it are
          # gone. This replaces the self-check they provided: an engine check
          # that has never fired is not known to be switched on, so CI puts the
          # bug back and requires the abort.
          #
          # Restoring the old guard means returning before zpp when called with
          # no arguments -- exactly the arginfo/zpp mismatch, which only a debug
          # engine notices.
          sed -i 's|ZEND_PARSE_PARAMETERS_START(1, 2) /\* judy-arginfo-negative-control \*/|if (ZEND_NUM_ARGS() == 0) { RETURN_NULL(); } /* CI negative control */ ZEND_PARSE_PARAMETERS_START(1, 2)|' php_judy.c
          grep -q 'CI negative control' php_judy.c \
            || { echo "::error::negative control did not apply — the anchor line in php_judy.c moved"; exit 1; }
          make

          set +e
          "$HOME/php-debug/bin/php" -d extension="$(pwd)/modules/judy.so" \
            -r 'new Judy();' > /tmp/negative-control-arginfo.log 2>&1
          rc=$?
          set -e
          cat /tmp/negative-control-arginfo.log

          if [ "$rc" -eq 0 ]; then
            echo "::error::a deliberate arginfo/zpp mismatch ran to completion — the debug engine checks are not in effect"
            exit 1
          fi
          grep -q 'Arginfo / zpp mismatch' /tmp/negative-control-arginfo.log \
            || { echo "::error::process failed but not via the arginfo/zpp check — see the log above"; exit 1; }
          echo "Negative control passed: the debug build caught the mismatch."

          git checkout -- php_judy.c

  build-harnesses:
    # tools/ holds the standalone C harnesses that back measured claims in
    # BENCHMARK.md and BACKEND_EVALUATION.md (plus the research/shm-arena
    # spike, compiled only). Nothing there ships, so until this job existed
    # nothing compiled it and nothing ran it -- which is how a generator came
    # to ignore its own length argument for years (#122) and how a documented
    # probe path shipped without ever having executed (#118).
    #
    # The parameter grid is what does the work here, not the sample size.
    # Every defect those two issues found is reachable at n = 1000; none of
    # them are reachable at the single (corpus, keylen, absent-key) point the
    # harnesses were habitually run at. The last step is the negative control:
    # an unfired gate is not a known-working gate.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Judy library
        run: sudo apt-get update && sudo apt-get install -y libjudy-dev

      - name: Build every harness and run the sanitized smoke grid
        run: ./tools/ci-smoke.sh 1000

      - name: Run the sanitized grid again against the bundled libJudy
        # The step above links the harnesses against the system library --
        # the --with-judy=DIR mode. The default build is the bundled tree
        # under libjudy/, so the same ASan+UBSan harness grid must cover it
        # too (#142 Stage 4). build-stock.sh compiles libjudy/src at the
        # shipped flag set (config.m4's isolated -O2 -fno-lto
        # -fno-unroll-loops -DJU_64BIT, -mpopcnt when accepted), so the
        # harnesses exercise the bytes a release build ships. Library-side
        # sanitization of the bundled tree lives in the differential-fuzz
        # job below, which drives far more of the API surface.
        run: |
          POPCNT=""
          echo 'int main(void){return 0;}' > /tmp/popcnt-probe.c
          cc -Werror -mpopcnt -c /tmp/popcnt-probe.c -o /dev/null 2>/dev/null && POPCNT="-mpopcnt"
          sh tools/differential-fuzz/validation/build-stock.sh \
            "$PWD/libjudy/src" /tmp/judy-bundled \
            -O2 -fno-lto -fno-unroll-loops $POPCNT
          JUDY_PREFIX=/tmp/judy-bundled ./tools/ci-smoke.sh 1000

      - name: Negative control -- reinstate the #122 bug, require the grid to catch it
        run: |
          # Put the defect back: make_key() padding a key up and never
          # truncating it, so every keylen below 16 silently emits the same
          # 16-byte key. Then require the grid to reject the tree.
          sed -i 's|if (keylen >= LONGKEY_MIN) {|if (keylen >= 0) {   /* CI negative control */|' \
            tools/write-probe-cost/probebench.c
          grep -q 'CI negative control' tools/write-probe-cost/probebench.c \
            || { echo "::error::negative control did not apply -- the anchor line in probebench.c moved"; exit 1; }

          set +e
          ./tools/ci-smoke.sh 1000 > /tmp/harness-negative-control.log 2>&1
          rc=$?
          set -e

          if [ "$rc" -eq 0 ]; then
            echo "::error::the smoke grid passed on a tree with the issue #122 generator bug reinstated"
            tail -40 /tmp/harness-negative-control.log
            exit 1
          fi
          grep -q 'make_key: emitted 16 bytes, wanted' /tmp/harness-negative-control.log \
            || { echo "::error::the grid failed, but not via the key-length guard -- check the log"; \
                 tail -40 /tmp/harness-negative-control.log; exit 1; }
          echo "Negative control passed: the grid caught the reinstated generator bug."

          git checkout -- tools/write-probe-cost/probebench.c

  differential-fuzz:
    # Differential fuzzing of the bundled libJudy against exact stdlib
    # oracles (tools/differential-fuzz/, #142 Stage 4): Judy1 vs std::set,
    # JudyL vs std::map, JudySL/JudyHS vs string maps, every return code and
    # value slot compared on every op. This is the invariant gate that would
    # have caught #131 (gcc -O3 silently losing Judy1 keys) in seconds --
    # see the recorded validation runs in tools/differential-fuzz/README.md.
    #
    # Profile split (documented in that README): CI runs the bounded profile
    # only -- the fixed-seed 48-cell smoke grid plus a short random-seed soak
    # on the production build, and the sanitized smoke grid. The 300s+ soaks
    # stay a local / pre-release tool.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build the bundled tree at the shipped production flags
        # The same isolated flag set config.m4 hands the vendored units
        # (-O2 -fno-lto -fno-unroll-loops -DJU_64BIT, plus -mpopcnt when the
        # compiler accepts it; build-stock.sh supplies -std=gnu99 -DJU_64BIT
        # itself), so the fuzzer exercises the bytes a release build ships,
        # not only a debug variant.
        run: |
          POPCNT=""
          echo 'int main(void){return 0;}' > /tmp/popcnt-probe.c
          cc -Werror -mpopcnt -c /tmp/popcnt-probe.c -o /dev/null 2>/dev/null && POPCNT="-mpopcnt"
          echo "mpopcnt: ${POPCNT:-not accepted by this compiler}"
          sh tools/differential-fuzz/validation/build-stock.sh \
            "$PWD/libjudy/src" /tmp/judy-prod \
            -O2 -fno-lto -fno-unroll-loops $POPCNT
          echo "JUDY_POPCNT=$POPCNT" >> "$GITHUB_ENV"

      - name: Verify the committed pre-generated tables match the generator
        # The shipped build compiles the committed Judy1Tables.c/JudyLTables.c;
        # build-stock.sh regenerates both by running the upstream generator.
        # Byte-compare the fresh output against the committed files' generator
        # region (between the php-judy header and the compile-time-pins
        # footer, see libjudy/PATCHES.md) so the library under fuzz and the
        # library that ships carry the same tables -- and so a size-class
        # header change cannot leave stale tables in the tree unnoticed.
        run: |
          strip_wrapper() {
            # committed file -> bare generator output
            awk 'phase==0 { if ($0=="#endif") phase=1; next }
                 phase==1 { if ($0=="") next; phase=2 }
                 /^\/\/ php-judy: compile-time pins\./ { exit }
                 { l[++n]=$0 }
                 END { while (n && l[n]=="") n--; for(i=1;i<=n;i++) print l[i] }' "$1"
          }
          trim_trailing() {
            awk '{ l[++n]=$0 } END { while (n && l[n]=="") n--; for(i=1;i<=n;i++) print l[i] }' "$1"
          }
          for v in 1 L; do
            committed="libjudy/src/Judy$v/Judy${v}Tables.c"
            grep -q '^// php-judy: compile-time pins\.' "$committed" \
              || { echo "::error::footer anchor missing from $committed -- the wrapper format moved"; exit 1; }
            strip_wrapper "$committed" > "/tmp/committed-$v.c"
            [ -s "/tmp/committed-$v.c" ] \
              || { echo "::error::stripping $committed produced no output -- the wrapper format moved"; exit 1; }
            trim_trailing "/tmp/judy-prod/obj/Judy${v}Tables.c" > "/tmp/generated-$v.c"
            if ! diff -u --label "generated Judy${v}Tables.c" --label "$committed (generator region)" \
                 "/tmp/generated-$v.c" "/tmp/committed-$v.c"; then
              echo "::error::committed Judy${v}Tables.c does not match the generator output -- regenerate it (see libjudy/PATCHES.md)"
              exit 1
            fi
            echo "Judy${v}Tables.c: committed copy matches the generator ($(wc -l < "/tmp/committed-$v.c") lines)"
          done

      - name: Fuzz the production build -- smoke grid + short soak
        # smoke: fixed seeds, full 48-cell domain/corpus grid, 60k ops/cell,
        # bulk sweep included (the #127 Count==31 boundary). soak: fresh
        # random seeds every run, time-bounded so the job stays flat.
        run: |
          make -C tools/differential-fuzz JUDY_PREFIX=/tmp/judy-prod
          cd tools/differential-fuzz
          ./diffuzz smoke
          ./diffuzz soak 30

      - name: Fuzz the sanitized build -- ASan+UBSan on library and harness
        # build-stock.sh at sanitizer flags instruments the vendored library
        # itself, not just the harness -- the configuration that catches
        # #127-class overflows inside libJudy (validation run V3 in the
        # README caught the JudyInsArray off-by-one exactly this way).
        run: |
          sh tools/differential-fuzz/validation/build-stock.sh \
            "$PWD/libjudy/src" /tmp/judy-asan \
            -O1 -g -fsanitize=address,undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
          make -C tools/differential-fuzz diffuzz-san JUDY_PREFIX=/tmp/judy-asan
          cd tools/differential-fuzz
          UBSAN_OPTIONS=print_stacktrace=1 ./diffuzz-san smoke

      - name: Negative control -- plant the #131 truncation, require a divergence
        # Re-create the #131 defect deterministically: truncate the immediate
        # index copy in JudyCascade.c to 8 bytes, which is byte-for-byte what
        # the gcc -O3 miscompile of the unpatched union did (silent Judy1 key
        # loss past the eighth member of a splayed sub-expanse). Source-level,
        # so it fires on any compiler. The fuzzer must fail with the judy1
        # missing-key signature, or this whole job is a green light with no
        # bulb in it.
        run: |
          cp -R libjudy/src /tmp/judy-broken-src
          sed -i 's|JU_COPYMEM(PjpJP->jp_1Index, PLeaf + Start,|JU_COPYMEM(PjpJP->jp_1Index, PLeaf + Start, (Pop1 > 8) ? 8 :   /* CI negative control */|' \
            /tmp/judy-broken-src/JudyCommon/JudyCascade.c
          grep -q 'CI negative control' /tmp/judy-broken-src/JudyCommon/JudyCascade.c \
            || { echo "::error::negative control did not apply -- the anchor line in JudyCascade.c moved"; exit 1; }

          sh tools/differential-fuzz/validation/build-stock.sh \
            /tmp/judy-broken-src /tmp/judy-broken \
            -O2 -fno-lto -fno-unroll-loops $JUDY_POPCNT
          make -C tools/differential-fuzz clean >/dev/null
          make -C tools/differential-fuzz JUDY_PREFIX=/tmp/judy-broken

          set +e
          (cd tools/differential-fuzz && ./diffuzz smoke) > /tmp/diffuzz-negctl.log 2>&1
          rc=$?
          set -e

          if [ "$rc" -eq 0 ]; then
            echo "::error::the smoke grid passed on a library with the #131-class truncation planted"
            tail -20 /tmp/diffuzz-negctl.log
            exit 1
          fi
          grep -q 'DIVERGENCE domain=judy1' /tmp/diffuzz-negctl.log \
            || { echo "::error::the fuzzer failed, but not with the judy1 divergence signature -- check the log"; \
                 tail -20 /tmp/diffuzz-negctl.log; exit 1; }
          echo "Negative control passed: the fuzzer caught the planted #131-class truncation."
          grep -m1 -A1 'DIVERGENCE' /tmp/diffuzz-negctl.log

  validate-pecl:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify PHP_JUDY_VERSION matches package.xml
        run: |
          SRC_VER=$(grep -oP '(?<=#define PHP_JUDY_VERSION ")[^"]+' php_judy.h)
          PKG_VER=$(grep -oP '(?<=<release>)[^<]+' package.xml | head -1)
          echo "php_judy.h:  PHP_JUDY_VERSION = $SRC_VER"
          echo "package.xml: <release>         = $PKG_VER"
          if [ "$SRC_VER" != "$PKG_VER" ]; then
            echo "ERROR: version mismatch — update PHP_JUDY_VERSION in php_judy.h to $PKG_VER"
            exit 1
          fi

      - name: Verify package.xml lists every tests/*.phpt
        # The test run below executes tests/*.phpt from the checkout, not from
        # the built tarball, so a .phpt missing from package.xml still passes
        # CI while being absent from the shipped package. Compare explicitly.
        run: |
          # git ls-files, not `ls tests/*.phpt`: support files (e.g. an .inc
          # fixture a .phpt drives) must ship too, or the installed package's
          # test suite breaks. Mirrors the libjudy/ check below.
          git ls-files tests/ | sort > /tmp/tests-on-disk.txt
          grep -oP '(?<=name=")tests/[^"]+(?=")' package.xml | sort > /tmp/tests-in-package.txt
          if ! diff -u --label package.xml --label tests/ \
               /tmp/tests-in-package.txt /tmp/tests-on-disk.txt; then
            echo "ERROR: package.xml and tests/ have diverged."
            echo "  '+' lines: tracked in git but not in package.xml — add"
            echo '            <file name="tests/<name>" role="test" />'
            echo "  '-' lines: in package.xml but not tracked — remove the entry"
            exit 1
          fi

      - name: Verify package.xml lists every file under libjudy/
        # Same rationale as the tests/ check above: the bundled libJudy only
        # builds from the shipped tarball if every git-tracked file under
        # libjudy/ is in package.xml (and package.xml lists nothing stale).
        # .gitattributes is repo plumbing and deliberately not shipped.
        run: |
          git ls-files libjudy/ | grep -v '^libjudy/\.gitattributes$' | sort > /tmp/libjudy-on-disk.txt
          grep -oP '(?<=name=")libjudy/[^"]+(?=")' package.xml | sort > /tmp/libjudy-in-package.txt
          if ! diff -u --label package.xml --label libjudy/ \
               /tmp/libjudy-in-package.txt /tmp/libjudy-on-disk.txt; then
            echo "ERROR: package.xml and libjudy/ have diverged."
            echo "  '+' lines: on disk but not in package.xml — add a <file> entry"
            echo "  '-' lines: in package.xml but not on disk — remove the entry"
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none

      - name: Build PECL package
        run: pecl package package.xml

      - name: Verify the package ships no tooling or research paths
        # The two checks above assert that everything under tests/ and
        # libjudy/ ships. This asserts the other direction: tools/ and
        # research/ must not. Both were absent from package.xml only by
        # happenstance until this gate existed.
        run: ./tools/check-package-contents.sh ./Judy-*.tgz

      - name: Negative control -- ship a research file, require the check to fail
        # An unfired gate is not a known-working gate. Add a research/ entry
        # to package.xml, repackage, and require the same script to reject the
        # tarball. Runs the script itself, not a copy of its logic.
        run: |
          sed -i 's|<dir name="/">|<dir name="/">\n         <file name="research/README.md" role="doc" />|' package.xml
          grep -q 'name="research/README.md"' package.xml \
            || { echo '::error::negative control did not apply -- the <dir name="/"> anchor in package.xml moved'; exit 1; }

          rm -f ./Judy-*.tgz
          pecl package package.xml

          set +e
          ./tools/check-package-contents.sh ./Judy-*.tgz > /tmp/pkg-negctl.log 2>&1
          rc=$?
          set -e
          cat /tmp/pkg-negctl.log

          if [ "$rc" -eq 0 ]; then
            echo "::error::the packaging check passed on a tarball that ships research/README.md"
            exit 1
          fi
          grep -q 'research/README.md' /tmp/pkg-negctl.log \
            || { echo "::error::the check failed, but not by naming the offending path -- see the log above"; exit 1; }
          echo "Negative control passed: the check caught the deliberately-shipped research file."

          git checkout -- package.xml
          rm -f ./Judy-*.tgz
          pecl package package.xml

      - name: Install from PECL package
        run: sudo pecl install --force ./Judy-*.tgz

      - name: Run tests against installed extension
        run: |
          JUDY_SO="$(php -r 'echo PHP_EXTENSION_DIR . DIRECTORY_SEPARATOR;')judy.so"
          RUN_TESTS=$(find "$(php-config --prefix)" -name run-tests.php 2>/dev/null | head -1)
          # run-tests.php writes temp files next to itself; copy to /tmp to avoid
          # "Permission denied" on the system-installed (root-owned) build directory.
          cp "$RUN_TESTS" /tmp/run-tests.php
          NO_INTERACTION=1 php /tmp/run-tests.php \
            -d "extension=$JUDY_SO" \
            -q --show-diff \
            tests/*.phpt

  build-windows:
    runs-on: windows-latest
    # Experimental (pre-release) PHP versions may fail without blocking CI.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.1", "8.2", "8.3", "8.4", "8.5"]
        arch: ["x64"]
        ts: ["nts"]
        include:
          # PHP 8.6 is pre-release (QA build via php-windows-builder); make
          # it required once 8.6 reaches RC/GA.
          - php-version: "8.6"
            arch: "x64"
            ts: "nts"
            experimental: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      # The bundled libJudy (libjudy/) builds via config.w32, and the P5 LLP64
      # patches are real source diffs now — the historical SourceForge
      # download + regex-patch step is gone (issue #142).
      - name: Disable Windows Error Reporting
        shell: pwsh
        run: |
          # Prevent WER from intercepting crashed test processes and stalling
          # run-tests.php for minutes per crash (STATUS_ACCESS_VIOLATION).
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting" /v Disabled /t REG_DWORD /d 1 /f
          reg add "HKLM\SOFTWARE\Microsoft\Windows\Windows Error Reporting\LocalDumps" /v DumpType /t REG_DWORD /d 0 /f

      - name: Exclude workspace from Windows Defender
        shell: pwsh
        run: |
          # Defender real-time scanning can lock .php temp files that
          # run-tests.php creates, causing 30-second timeouts and
          # "Permission denied" errors on retry.
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "${{ runner.temp }}"

      - name: Build the extension
        uses: php/php-windows-builder/extension@v1
        with:
          php-version: ${{ matrix.php-version }}
          arch: ${{ matrix.arch }}
          ts: ${{ matrix.ts }}
          test-workers: "1"
          test-runner-args: "--set-timeout 30"
        env:
          TEST_PHP_JUNIT: ${{ runner.temp }}\junit.xml

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-windows-${{ matrix.php-version }}-${{ matrix.arch }}-${{ matrix.ts }}
          path: ${{ runner.temp }}\junit.xml
          if-no-files-found: ignore

      - name: Run benchmarks
        if: success()
        shell: pwsh
        continue-on-error: true
        timeout-minutes: 15
        run: |
          $ErrorActionPreference = "Continue"

          # Locate php.exe from the build (php-windows-builder downloads PHP here)
          $phpExe = Get-ChildItem -Path ".\build" -Recurse -Filter "php.exe" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $phpExe) {
            Write-Host "WARNING: php.exe not found in .\build, skipping benchmarks"
            exit 0
          }
          $phpDir = $phpExe.DirectoryName
          Write-Host "Found PHP at: $phpDir"

          # Locate the built extension DLL
          $extDll = Get-ChildItem -Path ".\build" -Recurse -Filter "php_judy.dll" -ErrorAction SilentlyContinue |
            Select-Object -First 1
          if (-not $extDll) {
            Write-Host "WARNING: php_judy.dll not found, skipping benchmarks"
            exit 0
          }
          Write-Host "Found extension at: $($extDll.FullName)"

          # Put php.exe directory on PATH so shell_exec('php ...') sub-processes work
          $env:PATH = "$phpDir;$env:PATH"

          # Create/append php.ini next to php.exe so both main and sub-processes load the extension
          $iniPath = Join-Path $phpDir "php.ini"
          @"
          extension=$($extDll.FullName)
          memory_limit=4G
          "@ | Add-Content $iniPath

          # Verify extension loads
          $mods = & $phpExe.FullName -m 2>&1 | Out-String
          if ($mods -notmatch 'judy') {
            Write-Host "WARNING: judy extension not loading, skipping benchmarks"
            Write-Host $mods
            exit 0
          }
          Write-Host "Extension verified"

          # Unified benchmark: all suites, JSON output for cross-version comparison
          & $phpExe.FullName examples/benchmarks/judy-bench.php `
            --json bench.json --size 500000 --iterations 7 --suite all `
            2>&1 | Tee-Object -FilePath benchmark-output.txt

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-windows-php${{ matrix.php-version }}-${{ matrix.arch }}-${{ matrix.ts }}
          path: |
            bench.json
            benchmark-output.txt
          if-no-files-found: ignore

      - name: Debug on failure
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"

          Write-Host "=== Configure log (tail) ==="
          Get-ChildItem -Path ".\build" -Recurse -Filter "config*.log" -ErrorAction SilentlyContinue |
            Select-Object -First 1 | ForEach-Object { Get-Content $_.FullName -Tail 50 }

          Write-Host "`n=== Build log (tail) ==="
          Get-ChildItem -Path ".\build" -Recurse -Filter "build*.log" -ErrorAction SilentlyContinue |
            Select-Object -First 1 | ForEach-Object { Get-Content $_.FullName -Tail 30 }

  # Negative control for the 32-bit bundled-build guards (#159). Inverted, in
  # the same spirit as the differential-fuzz negative control (#142 Stage 4):
  # this job is GREEN when the guards correctly REFUSE a 32-bit bundled build,
  # and RED if a guard is ever removed, weakened, or its message drifts.
  #
  # Why this and not an x86 leg in build-windows: an x86 leg is red-when-correct,
  # which reads as a broken board and invites someone to "fix" it by deleting the
  # guard. The one-time proof that the config.w32 guard fires on real MSVC x86 is
  # recorded in issue #159 (CI job 95934686125: configure aborts with
  # "ERROR: the bundled libJudy currently supports 64-bit targets only ..."). What
  # can silently drift afterwards is the guard's own source, and that is exactly
  # what this job pins -- deterministically, on a Linux runner, in seconds.
  #
  # Each assertion matches the guard's MESSAGE, not merely a nonzero exit, so an
  # unrelated breakage cannot masquerade as the guard working.
  guard-32bit:
    name: 32-bit bundled build is refused (negative control)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # config.w32 is JScript. Drive it through the php-src Windows build API,
      # stubbed, with X64 set the way php-src sets it (win32/build/config.w32:
      # "X64 = TARGET_ARCH != 'x86'"). ERROR() throws here, standing in for
      # confutils.js's WScript.Quit(3).
      - name: config.w32 refuses a 32-bit target
        run: |
          cat > /tmp/harness.js <<'HARNESS'
          var fs = require('fs');
          var st = { flags: [], errors: [], warnings: [], extensions: [] };
          function ARG_WITH() {}
          function EXTENSION() { st.extensions.push(Array.prototype.slice.call(arguments)); }
          function ADD_EXTENSION_DEP() {}
          function AC_DEFINE() {}
          function ADD_FLAG(n, v) { st.flags.push(n + ' ' + v); }
          function ADD_SOURCES() {}
          function CHECK_LIB() { return false; }
          function CHECK_HEADER_ADD_INCLUDE() { return false; }
          function WARNING(m) { st.warnings.push(m); }
          function ERROR(m) { st.errors.push(m); throw { __abort: true }; }
          var configure_module_dirname = 'C:\\php\\pecl\\judy';
          var PHP_JUDY = 'yes';
          var PHP_JUDY_SHARED = true;
          var X64 = (process.argv[3] !== 'x86');
          try { eval(fs.readFileSync(process.argv[2], 'utf8')); }
          catch (e) { if (!e || !e.__abort) throw e; }
          console.log(JSON.stringify(st));
          HARNESS

          echo "--- x86: must ERROR with the 64-bit-only message ---"
          node /tmp/harness.js config.w32 x86 > /tmp/x86.json
          cat /tmp/x86.json
          node -e '
            var r = require("/tmp/x86.json");
            var m = r.errors.join("\n");
            if (r.errors.length !== 1) {
              throw new Error("expected exactly 1 ERROR() on x86, got " + r.errors.length +
                " -- the config.w32 32-bit guard is missing or no longer aborts");
            }
            if (!/bundled libJudy currently supports 64-bit targets only/.test(m) ||
                !/JU_64BIT/.test(m) || !/--with-judy=DIR/.test(m)) {
              throw new Error("ERROR() message drifted; it must still name the cause " +
                "(64-bit only / JU_64BIT) and the way out (--with-judy=DIR). Got: " + m);
            }
            if (r.extensions.length !== 0) {
              throw new Error("configure kept going after the guard fired");
            }
            console.log("OK: x86 refused with the expected message");
          '

          echo "--- x64: must proceed and define JU_64BIT ---"
          node /tmp/harness.js config.w32 x64 > /tmp/x64.json
          cat /tmp/x64.json
          node -e '
            var r = require("/tmp/x64.json");
            if (r.errors.length !== 0) {
              throw new Error("x64 must not be refused, got: " + r.errors.join("; "));
            }
            if (r.flags.indexOf("CFLAGS_JUDY /D JU_64BIT") === -1) {
              throw new Error("x64 build lost /D JU_64BIT; flags were: " + r.flags.join(" | "));
            }
            if (r.extensions.length !== 1) {
              throw new Error("x64 build did not register the extension");
            }
            console.log("OK: x64 proceeds with /D JU_64BIT");
          '

      # Backstop that lives with the data: the pre-generated tables must refuse
      # to compile without JU_64BIT whatever build system wires them in.
      - name: Pre-generated tables refuse a 32-bit word
        run: |
          # Simulate MSVC x86 / any ILP32 target: claim Judy.h's _WORD_T guard
          # with a genuinely 4-byte Word_t and leave JU_64BIT undefined.
          cat > /tmp/word32.h <<'EOF'
          #define _WORD_T
          typedef unsigned int Word_t, * PWord_t;
          EOF

          INC="-Ilibjudy/src -Ilibjudy/src/JudyCommon -Ilibjudy/src/Judy1 -Ilibjudy/src/JudyL"
          rc=0
          for f in libjudy/src/Judy1/Judy1Tables.c libjudy/src/JudyL/JudyLTables.c; do
            echo "--- $f: 32-bit word must be rejected ---"
            if cc -fsyntax-only -include /tmp/word32.h $INC "$f" 2>/tmp/err.txt; then
              echo "FAIL: $f compiled with a 4-byte Word_t and no JU_64BIT"; rc=1; continue
            fi
            if ! grep -q "require a 64-bit build" /tmp/err.txt; then
              echo "FAIL: $f was rejected, but not by the JU_64BIT guard."
              echo "      The #error backstop is missing or its message drifted."
              head -20 /tmp/err.txt; rc=1; continue
            fi
            echo "OK: rejected by the JU_64BIT #error guard"

            echo "--- $f: 64-bit build must still be clean ---"
            if ! cc -c -Wall -Werror -O2 -DJU_64BIT $INC "$f" -o /tmp/ok.o 2>/tmp/err64.txt; then
              echo "FAIL: $f no longer compiles for a normal 64-bit build"
              head -20 /tmp/err64.txt; rc=1; continue
            fi
            echo "OK: 64-bit build unaffected"
          done
          exit $rc

  report-results:
    needs: [build-linux, build-windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      checks: write
      pull-requests: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          sparse-checkout: baselines

      - name: Download all test artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: junit-*
          path: artifacts

      - name: Download benchmark artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: benchmark-*
          path: benchmarks
        continue-on-error: true

      - name: Publish test check
        # Fork PRs run with a read-only GITHUB_TOKEN; skip API writes there.
        if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          # Exclude experimental (pre-release) PHP versions from the
          # pass/fail check; they still appear in the consolidated report.
          files: |
            artifacts/**/*.xml
            !artifacts/junit-*8.6*/**
          check_name: "Test Results"
          comment_mode: "off"
          job_summary: false

      - name: Build consolidated report
        run: |
          python3 << 'PYEOF'
          import xml.etree.ElementTree as ET
          import os, glob, re, json

          # ── Test Results ──────────────────────────────────────────
          # Pre-release PHP versions: failures shown but don't affect
          # the overall verdict (their CI jobs are continue-on-error).
          EXPERIMENTAL = {"8.6"}
          rows = []
          for xml_file in sorted(glob.glob("artifacts/junit-*/*.xml")):
              dir_name = os.path.basename(os.path.dirname(xml_file))
              parts = dir_name.replace("junit-", "").split("-")

              if parts[0] == "linux":
                  platform, php, arch, ts = "Linux", parts[1], "x64", "-"
              else:
                  platform = "Windows"
                  php = parts[1]
                  arch = parts[2] if len(parts) > 2 else "x64"
                  ts = parts[3] if len(parts) > 3 else "nts"

              try:
                  tree = ET.parse(xml_file)
                  root = tree.getroot()
                  ts_elem = root.find("testsuite") if root.tag == "testsuites" else root
                  if ts_elem is None:
                      continue
                  tests = int(ts_elem.get("tests", 0))
                  failures = int(ts_elem.get("failures", 0))
                  errors = int(ts_elem.get("errors", 0))
                  skipped = int(ts_elem.get("skipped", 0))
                  time_val = float(ts_elem.get("time", 0))
                  passed = tests - failures - errors - skipped
                  status = "\u2705" if failures == 0 and errors == 0 else "\u274c"
                  if php in EXPERIMENTAL:
                      status += " \U0001F9EA"
              except Exception:
                  tests = failures = errors = skipped = passed = 0
                  time_val = 0.0
                  status = "\u26a0\ufe0f"

              rows.append({
                  "php": php, "platform": platform, "arch": arch, "ts": ts,
                  "tests": tests, "passed": passed, "failures": failures,
                  "skipped": skipped, "errors": errors,
                  "duration": f"{time_val:.1f}s", "status": status
              })

          rows.sort(key=lambda r: (r["platform"], [int(x) for x in r["php"].split(".")]))

          lines = []
          lines.append("## Test Results\n")
          lines.append("| | PHP | Platform | Arch | TS | Tests | Pass | Fail | Skip | Duration |")
          lines.append("|---|-----|----------|------|----|-------|------|------|------|----------|")
          for r in rows:
              lines.append(
                  f'| {r["status"]} | {r["php"]} | {r["platform"]} '
                  f'| {r["arch"]} | {r["ts"]} | {r["tests"]} | {r["passed"]} '
                  f'| {r["failures"]} | {r["skipped"]} | {r["duration"]} |'
              )

          total_tests = sum(r["tests"] for r in rows)
          total_pass = sum(r["passed"] for r in rows)
          total_fail = sum(r["failures"] for r in rows)
          total_skip = sum(r["skipped"] for r in rows)
          required = [r for r in rows if r["php"] not in EXPERIMENTAL]
          all_pass = (all(r["failures"] == 0 and r["errors"] == 0 for r in required)
                      if required else total_fail == 0)
          icon = "\u2705" if all_pass else "\u274c"
          lines.append(
              f"| {icon} | **Total** | | | "
              f"| **{total_tests}** | **{total_pass}** | **{total_fail}** "
              f"| **{total_skip}** | |"
          )

          # ── Benchmark Results (from JSON) ─────────────────────────

          def fmt_ms(ms):
              """Format milliseconds for display."""
              if ms is None:
                  return "-"
              if ms >= 1:
                  return f"{ms:.1f} ms"
              return f"{ms:.2f} ms"

          def fmt_speedup(judy_ms, php_ms):
              """Speedup = PHP / Judy. >1 = Judy faster.
              Returns (judy_str, php_str, speedup_str)."""
              if judy_ms is None or php_ms is None:
                  return "-", "-", "-"
              j_str = fmt_ms(judy_ms)
              p_str = fmt_ms(php_ms)
              if judy_ms <= 0:
                  return j_str, p_str, "**\u221e**"
              s = php_ms / judy_ms
              if s >= 100:
                  text = f"{s:.0f}x"
              elif s >= 1.05:
                  text = f"{s:.1f}x"
              elif s >= 0.95:
                  text = "~1.0x"
              else:
                  text = f"{s:.1f}x"
              return j_str, p_str, f"**{text}**" if s >= 1.05 else text

          def fmt_speedup_only(judy_ms, php_ms):
              """Compact speedup for cross-version tables."""
              if judy_ms is None or php_ms is None:
                  return "-"
              if judy_ms <= 0:
                  return "**\u221e**"
              s = php_ms / judy_ms
              if s >= 100:
                  text = f"{s:.0f}x"
              elif s >= 1.05:
                  text = f"{s:.1f}x"
              elif s >= 0.95:
                  text = "~1.0x"
              else:
                  text = f"{s:.1f}x"
              return f"**{text}**" if s >= 1.05 else text

          def fmt_bytes(b):
              if b is None or b <= 0:
                  return "-"
              if b >= 1 << 20:
                  return f"{b / (1 << 20):.1f} MB"
              if b >= 1 << 10:
                  return f"{b / (1 << 10):.1f} KB"
              return f"{b} B"

          def fmt_mem_savings(judy_bytes, php_bytes):
              # Direction is stated in words, never left to the reader to infer
              # from a number below 1.0: Judy::INT_TO_MIXED genuinely uses MORE
              # memory than a PHP array, and "0.6x" read as a saving is how that
              # loss got published as a win.
              if judy_bytes is None or php_bytes is None:
                  return "-"
              if judy_bytes <= 0:
                  return "-"
              ratio = php_bytes / judy_bytes
              if ratio >= 1.05:
                  return f"**{ratio:.1f}x smaller**"
              if ratio >= 0.95:
                  return "about the same"
              return f"{1 / ratio:.2f}x **larger**"

          def get_metric(benchmarks, key, field="median_ms"):
              entry = benchmarks.get(key)
              if entry is None:
                  return None
              return entry.get(field)

          # Type definitions with human-readable labels
          all_types = [
              ("bitset", "Bitset"),
              ("int_to_int", "Int to Int"),
              ("int_to_mixed", "Int to Mixed"),
              ("int_to_packed", "Int to Packed"),
              ("string_to_int", "String to Int"),
              ("string_to_mixed", "String to Mixed"),
              ("string_to_int_hash", "String to Int (Hash)"),
              ("string_to_mixed_hash", "String to Mixed (Hash)"),
              ("string_to_int_adaptive", "String to Int (Adaptive)"),
              ("string_to_mixed_adaptive", "String to Mixed (Adaptive)"),
          ]
          # Representative subset for the main view
          main_types = [
              ("bitset", "Bitset"),
              ("int_to_int", "Int to Int"),
              ("int_to_mixed", "Int to Mixed"),
              ("string_to_int", "String to Int"),
              ("string_to_int_adaptive", "String to Int (Adaptive)"),
          ]

          api_ops = [
              ("api.putAll.int_to_int", "putAll()"),
              ("api.fromArray.int_to_int", "fromArray()"),
              ("api.toArray.int_to_int", "toArray()"),
              ("api.getAll.int_to_int", "getAll()"),
              ("api.keys.int_to_int", "keys()"),
              ("api.values.int_to_int", "values()"),
              ("api.sumValues.int_to_int", "sumValues()"),
              ("api.populationCount.int_to_int", "populationCount()"),
              ("api.deleteRange.int_to_int", "deleteRange()"),
              ("api.equals.int_to_int", "equals()"),
              ("api.setop.union.bitset", "union() Bitset"),
              ("api.setop.intersect.bitset", "intersect() Bitset"),
              ("api.setop.diff.bitset", "diff() Bitset"),
              ("api.setop.xor.bitset", "xor() Bitset"),
              ("api.mergeWith.int_to_int", "mergeWith() Int\u2192Int"),
              ("api.mergeWith.string_to_int", "mergeWith() Str\u2192Int"),
              ("adv.forEach.int_to_int", "forEach() Int\u2192Int"),
              ("adv.filter.int_to_int", "filter() Int\u2192Int"),
              ("adv.map.int_to_int", "map() Int\u2192Int"),
              ("adv.forEach.string_to_int", "forEach() Str\u2192Int"),
              ("adv.filter.string_to_int", "filter() Str\u2192Int"),
              ("adv.map.string_to_int", "map() Str\u2192Int"),
          ]

          # Rows whose "speedup" is a property of the two algorithms' complexity
          # classes, not of this build. Arithmetically true, rhetorically empty:
          # populationCount() reported 235,315x on a 500k run purely because the
          # PHP arm walks every element and libJudy answers from a counter. The
          # multiple grows with --size and shrinks with it, which is exactly why
          # it should not be read as a result.
          definitional_ratio_ops = {"api.populationCount.int_to_int"}

          # Load JSON benchmark data per (platform, php_ver)
          bench_json = {}
          bench_text = {}

          for bench_dir in sorted(glob.glob("benchmarks/benchmark-*")):
              dir_name = os.path.basename(bench_dir)
              m = re.match(r'^benchmark-(linux|windows)-php([\d.]+)', dir_name)
              if not m:
                  continue
              platform = m.group(1).capitalize()
              php_ver = m.group(2)

              json_file = os.path.join(bench_dir, "bench.json")
              if os.path.isfile(json_file):
                  with open(json_file) as f:
                      try:
                          bench_json[(platform, php_ver)] = json.load(f)
                      except json.JSONDecodeError:
                          pass

              text_file = os.path.join(bench_dir, "benchmark-output.txt")
              if os.path.isfile(text_file):
                  with open(text_file) as f:
                      bench_text[(platform, php_ver)] = f.read().strip()

          if bench_json:
              # Determine platforms and versions
              platforms = sorted(set(p for p, _ in bench_json.keys()))
              platform_versions = {}
              for platform in platforms:
                  platform_versions[platform] = sorted(
                      [v for p, v in bench_json.keys() if p == platform],
                      key=lambda v: [int(x) for x in v.split(".")]
                  )

              # Get metadata from the latest version of the primary platform
              primary = "Linux" if "Linux" in platforms else platforms[0]
              latest = platform_versions[primary][-1]
              meta = bench_json.get((primary, latest), {}).get("metadata", {})
              judy_ver = meta.get("judy_version", "?")
              elem_size = meta.get("size", 500000)
              iters = meta.get("iterations", 3)

              lines.append("")
              lines.append("## Benchmark Results\n")
              lines.append(
                  f"> {elem_size:,} elements, {iters} iterations (median), "
                  f"Judy {judy_ver}\n"
              )

              # ── Run Status grid ──
              all_versions = sorted(
                  set(v for _, v in bench_json.keys()),
                  key=lambda v: [int(x) for x in v.split(".")]
              )
              lines.append("### Run Status\n")
              ver_hdr = " | ".join(f"PHP {v}" for v in all_versions)
              lines.append(f"| Platform | {ver_hdr} |")
              lines.append("|---|" + "|".join("---" for _ in all_versions) + "|")
              for platform in platforms:
                  cells = []
                  for v in all_versions:
                      if (platform, v) in bench_json:
                          cells.append("\u2705")
                      else:
                          cells.append("\u2014")
                  lines.append(f"| {platform} | " + " | ".join(cells) + " |")
              lines.append("")

              # ── Helper to emit tables for a given platform/version ──
              def emit_tables(platform, ver, heading_suffix=""):
                  data = bench_json.get((platform, ver), {})
                  bm = data.get("benchmarks", {})
                  if not bm:
                      return

                  tag = f" ({platform}, PHP {ver})"

                  # Memory. `rss_bytes` (floor-subtracted peak RSS of a child
                  # process) is the ONLY field here that can see a Judy index:
                  # libJudy allocates through malloc(3), so the `heap_bytes`
                  # this table used to print was the PHP-object wrapper and
                  # nothing else — 160 B for a 500,000-element BITSET, published
                  # as "52454.9x less". See issue #172. When rss_bytes is absent
                  # (no getrusage(), i.e. Windows) say so instead of falling
                  # back to the number that caused the defect.
                  meta = data.get("metadata", {})
                  n_meas = meta.get("size")
                  size_tag = f", n = {n_meas:,}" if isinstance(n_meas, int) else ""
                  # Resolution = the floor's own run-to-run spread. A structure
                  # smaller than that is reported as an upper bound; quoting a
                  # point estimate there would publish noise (a dense 500k
                  # BITSET is ~41 KB against a floor that moves ~250 KB).
                  res = meta.get("memory_resolution_bytes") or 0
                  mem_rows = [
                      (label,
                       get_metric(bm, f"core.{t}.heap.judy", "rss_bytes"),
                       get_metric(bm, f"core.{t}.heap.php", "rss_bytes"))
                      for t, label in all_types
                  ]
                  mem_rows = [r for r in mem_rows if r[1] is not None or r[2] is not None]
                  lines.append(f"### Memory{tag}{heading_suffix}\n")
                  if mem_rows:
                      lines.append(
                          f"Peak RSS of a child process building one structure{size_tag}, "
                          "minus an empty-process floor. Judy's memory advantage is "
                          "type- and scale-dependent — see "
                          "[BENCHMARK.md](../blob/main/BENCHMARK.md#memory--the-headline-and-the-least-equivocal-result) "
                          "for the curve across sizes on a dedicated host.\n"
                      )
                      lines.append("| Type | Judy | PHP array | Judy vs PHP array |")
                      lines.append("|------|-----:|----------:|-------------------|")
                      any_bounded = False
                      for label, j_mem, p_mem in mem_rows:
                          if j_mem is not None and res and j_mem <= res:
                              any_bounded = True
                              j_str = f"< {fmt_bytes(res)}"
                              s_str = (f"> **{p_mem / res:.0f}x smaller**"
                                       if p_mem else "-")
                          else:
                              j_str = fmt_bytes(j_mem)
                              s_str = fmt_mem_savings(j_mem, p_mem)
                          lines.append(
                              f"| {label} | {j_str} "
                              f"| {fmt_bytes(p_mem)} "
                              f"| {s_str} |"
                          )
                      if any_bounded:
                          lines.append(
                              f"\n`<` marks a structure smaller than this instrument can "
                              f"resolve at n = {n_meas:,}: run-to-run movement in the "
                              f"empty-process floor puts the resolution at "
                              f"{fmt_bytes(res)}. The bound is real, the "
                              f"exact figure is not available at this size — "
                              "BENCHMARK.md measures the same types up to n = 8M, where "
                              "they are well clear of the floor.\n"
                          )
                  else:
                      lines.append(
                          "Not measured on this platform: the footprint instrument is "
                          "`getrusage()`, which PHP does not provide on Windows. "
                          "`memory_get_usage()` is not a substitute — it cannot see a "
                          "Judy index at all.\n"
                      )
                  lines.append("")

                  # API Speedups
                  has_api = any(
                      get_metric(bm, f"{prefix}.judy") is not None
                      for prefix, _ in api_ops
                  )
                  if has_api:
                      lines.append(f"### API Speedups{tag}{heading_suffix}\n")
                      lines.append(
                          "Speedup = PHP time / Judy time. "
                          "**Bold** = Judy faster.\n"
                      )
                      lines.append("| Operation | Judy | PHP | Speedup |")
                      lines.append("|-----------|-----:|----:|---------|")
                      for prefix, label in api_ops:
                          j_ms = get_metric(bm, f"{prefix}.judy")
                          p_ms = get_metric(bm, f"{prefix}.php")
                          if j_ms is None:
                              continue
                          j_str, p_str, s_str = fmt_speedup(j_ms, p_ms)
                          # A ratio whose value is fixed by the two complexity
                          # classes is not a measurement of this build. Both
                          # timings still print — they are what a regression
                          # would move — but the ratio is labelled for what it
                          # is instead of shouting a five-figure multiple.
                          if prefix in definitional_ratio_ops:
                              s_str = "O(1) vs O(n)"
                          lines.append(
                              f"| {label} | {j_str} | {p_str} | {s_str} |"
                          )
                      lines.append("")
                      if any(p in definitional_ratio_ops for p, _ in api_ops):
                          lines.append(
                              "`O(1) vs O(n)` marks a row whose ratio is decided by the "
                              "complexity classes rather than measured: `populationCount()` "
                              "reads libJudy's cached population, the PHP arm counts every "
                              "element. It scales with `n` and says nothing about this "
                              "change. judy-bench.php declines the same comparison for "
                              "`size($lo, $hi)` for the same reason.\n"
                          )

                  # Core Types (representative in main, all in detail)
                  def emit_core_table(type_list, detail_tag=""):
                      lines.append(f"### Core Types{tag}{detail_tag}{heading_suffix}\n")
                      lines.append(
                          "Speedup = PHP time / Judy time. "
                          "**Bold** = Judy faster.\n"
                      )
                      lines.append("| Type | Op | Judy | PHP array | Speedup |")
                      lines.append("|------|----|-----:|----------:|---------|")
                      for type_id, label in type_list:
                          for metric, op_label in [
                              ("write", "Write"), ("read", "Read"),
                              ("iter", "Iter"), ("free", "Free"),
                          ]:
                              j_ms = get_metric(bm, f"core.{type_id}.{metric}.judy")
                              p_ms = get_metric(bm, f"core.{type_id}.{metric}.php")
                              if j_ms is None and p_ms is None:
                                  continue
                              j_str, p_str, s_str = fmt_speedup(j_ms, p_ms)
                              lines.append(
                                  f"| {label} | {op_label} "
                                  f"| {j_str} | {p_str} | {s_str} |"
                              )
                      lines.append("")

                  emit_core_table(main_types)

                  # Collapsible: all types
                  extra_types = [t for t in all_types if t not in main_types]
                  has_extra = any(
                      get_metric(bm, f"core.{tid}.write.judy") is not None
                      for tid, _ in extra_types
                  )
                  if has_extra:
                      lines.append(
                          "<details><summary>All types detail"
                          "</summary>\n"
                      )
                      emit_core_table(all_types, " \u2014 All")
                      lines.append("</details>\n")

              # ── Primary platform (Linux) ── shown expanded ──
              emit_tables(primary, latest)

              # ── Cross-version detail per platform ──
              for platform in platforms:
                  versions = platform_versions[platform]
                  if len(versions) <= 1:
                      continue
                  lines.append(
                      f"<details><summary>Cross-version detail "
                      f"({platform})</summary>\n"
                  )
                  ver_hdr = " | ".join(f"PHP {v}" for v in versions)

                  # Core cross-version table
                  lines.append(f"#### Core Types \u2014 {platform}\n")
                  lines.append(
                      "Each cell: Judy ms (speedup vs PHP array).\n"
                  )
                  lines.append(f"| Type | Op | {ver_hdr} |")
                  lines.append("|---|---|" + "|".join("---" for _ in versions) + "|")
                  for type_id, label in all_types:
                      for metric, op_label in [("write", "Write"), ("read", "Read")]:
                          cells = []
                          any_data = False
                          for v in versions:
                              data = bench_json.get((platform, v), {})
                              bm = data.get("benchmarks", {})
                              j_ms = get_metric(bm, f"core.{type_id}.{metric}.judy")
                              p_ms = get_metric(bm, f"core.{type_id}.{metric}.php")
                              if j_ms is not None:
                                  s = fmt_speedup_only(j_ms, p_ms)
                                  cells.append(f"{fmt_ms(j_ms)} ({s})")
                                  any_data = True
                              else:
                                  cells.append("-")
                          if any_data:
                              lines.append(
                                  f"| {label} | {op_label} | "
                                  + " | ".join(cells) + " |"
                              )
                  lines.append("")

                  # API cross-version table
                  lines.append(f"#### API \u2014 {platform}\n")
                  lines.append(f"| Operation | {ver_hdr} |")
                  lines.append("|---|" + "|".join("---" for _ in versions) + "|")
                  for prefix, label in api_ops:
                      cells = []
                      any_data = False
                      for v in versions:
                          data = bench_json.get((platform, v), {})
                          bm = data.get("benchmarks", {})
                          j_ms = get_metric(bm, f"{prefix}.judy")
                          p_ms = get_metric(bm, f"{prefix}.php")
                          if j_ms is not None:
                              s = fmt_speedup_only(j_ms, p_ms)
                              cells.append(f"{fmt_ms(j_ms)} ({s})")
                              any_data = True
                          else:
                              cells.append("-")
                      if any_data:
                          lines.append(
                              f"| {label} | " + " | ".join(cells) + " |"
                          )
                  lines.append("")
                  lines.append("</details>\n")

              # ── Secondary platforms (e.g. Windows) in collapsible ──
              for platform in platforms:
                  if platform == primary:
                      continue
                  p_latest = platform_versions[platform][-1]
                  lines.append(
                      f"<details><summary>{platform} results "
                      f"(PHP {p_latest})</summary>\n"
                  )
                  emit_tables(platform, p_latest)
                  lines.append("</details>\n")

              # ── Cross-release baseline comparison ──
              # Preferred: the interleaved A/B comparison produced on the same
              # runner by scripts/bench-compare.php. Running the two suites
              # back to back put the arms minutes apart and reported runner
              # drift as regressions (issue #87); this artifact instead carries
              # paired per-round ratios with confidence intervals.
              compare = None
              for cf in sorted(glob.glob(
                  "benchmarks/benchmark-baseline-*/bench-compare.json"
              )):
                  with open(cf) as f:
                      try:
                          compare = json.load(f)
                      except json.JSONDecodeError:
                          compare = None
                  break

              if compare and compare.get("benchmarks"):
                  meta = compare.get("metadata", {})
                  drift = compare.get("drift", {})
                  counts = compare.get("counts", {})
                  rows = compare["benchmarks"]

                  lines.append(
                      f"### Release Comparison "
                      f"({meta.get('baseline_version', '?')} → "
                      f"{meta.get('current_version', '?')})\n"
                  )
                  lines.append(
                      f"> Interleaved A/B comparison against v"
                      f"{meta.get('baseline_version', '?')} "
                      f"(`pie install`) on the **same CI runner**: "
                      f"{len(meta.get('groups', []))} benchmark groups × "
                      f"{meta.get('rounds', '?')} rounds × 2 arms, "
                      f"{meta.get('size', 0):,} elements, "
                      f"median of {meta.get('iterations', '?')} per child. "
                      f"Each row is the median of the paired "
                      f"current/baseline ratios with a 95% "
                      f"percentile-bootstrap CI; it is flagged only when the "
                      f"whole drift-adjusted CI clears "
                      f"±{meta.get('threshold_pct', 10):.0f}%. "
                      f"Advisory — benchmarks never gate a merge.\n"
                  )

                  php_ctl = drift.get("php_control_median_delta_pct")
                  common = drift.get(
                      "common_mode_pct", drift.get("median_delta_pct", 0)
                  )
                  drift_note = (
                      f"Run-wide median delta "
                      f"{drift.get('median_delta_pct', 0):+.2f}% "
                      f"(PHP-array control "
                      + ("n/a" if php_ctl is None else f"{php_ctl:+.2f}%")
                      + f"); runner common-mode {common:+.2f}% "
                      f"divided out of every row."
                  )
                  if drift.get("contaminated"):
                      thr = meta.get("drift_threshold_pct", 5)
                      if php_ctl is None:
                          why = (
                              f"No PHP-array control row was usable, and "
                              f"the whole suite moved together past the "
                              f"±{thr:.0f}% threshold — read as runner "
                              f"movement, not code."
                          )
                      else:
                          why = (
                              f"The control runs no judy code, so its "
                              f"shift past the ±{thr:.0f}% threshold "
                              f"means the runner itself changed speed "
                              f"under the measurement."
                          )
                      lines.append(
                          f"> ⚠️ **Comparison contaminated.** "
                          f"{drift_note} {why} Individual flags are "
                          f"suppressed — re-run the job for a usable "
                          f"comparison.\n"
                      )
                  else:
                      lines.append(f"> {drift_note}\n")

                  parts = []
                  if counts.get("faster"):
                      parts.append(f"{counts['faster']} faster")
                  if counts.get("slower"):
                      parts.append(
                          f"⚠️ **{counts['slower']} regressions**"
                      )
                  else:
                      parts.append("0 regressions")
                  if counts.get("same"):
                      parts.append(f"{counts['same']} unchanged")
                  if counts.get("unstable"):
                      parts.append(
                          f"{counts['unstable']} not evaluated (unstable)"
                      )
                  if counts.get("new"):
                      parts.append(f"{counts['new']} new")
                  if counts.get("removed"):
                      parts.append(f"{counts['removed']} removed")
                  lines.append("**Summary**: " + ", ".join(parts) + "\n")

                  def cmp_row(name, r):
                      d = r.get("adj_delta_pct", 0.0)
                      ci = r.get("adj_ci_delta_pct", [0.0, 0.0])
                      d_str = "0.0%" if abs(d) < 0.05 else f"{d:+.1f}%"
                      ci_str = f"[{ci[0]:+.1f}%, {ci[1]:+.1f}%]"
                      st = r.get("status", "~same")
                      if st == "FASTER":
                          s_str = "✅ **FASTER**"
                      elif st == "SLOWER":
                          s_str = "⚠️ **SLOWER**"
                      elif st == "unstable":
                          s_str = "— unstable"
                      else:
                          s_str = "~same"
                      return (
                          f"| {name} | {fmt_ms(r.get('baseline_ms'))} "
                          f"| {fmt_ms(r.get('current_ms'))} | {d_str} "
                          f"| {ci_str} | {s_str} |"
                      )

                  header = [
                      "| Benchmark | Baseline | Current | Delta | 95% CI "
                      "| Status |",
                      "|-----------|----------|---------|------:|--------:"
                      "|--------|",
                  ]
                  evaluated = [
                      (n, r) for n, r in sorted(rows.items())
                      if r.get("status") != "unstable"
                  ]
                  unstable = [
                      (n, r) for n, r in sorted(rows.items())
                      if r.get("status") == "unstable"
                  ]
                  if evaluated:
                      lines.extend(header)
                      for n, r in evaluated:
                          lines.append(cmp_row(n, r))
                      lines.append("")
                  if unstable:
                      lines.append(
                          f"<details><summary>{len(unstable)} benchmarks not "
                          f"evaluated (within-arm scatter exceeded the effect "
                          f"being claimed)</summary>\n"
                      )
                      lines.extend(header)
                      for n, r in unstable:
                          lines.append(cmp_row(n, r))
                      lines.append("")
                      lines.append("</details>\n")

                  # ── Memory Comparison ──
                  type_label_map = dict(all_types)
                  mem_rows = []
                  mem_counts = {"better": 0, "worse": 0, "same": 0}
                  for mid, m in sorted(compare.get("memory", {}).items()):
                      mid_parts = mid.split(".")
                      if len(mid_parts) < 2:
                          continue
                      name = type_label_map.get(mid_parts[1], mid_parts[1])
                      b_heap = m.get("baseline_bytes") or 0
                      c_heap = m.get("current_bytes") or 0
                      if b_heap <= 0:
                          delta, status = 0.0, "~same"
                          mem_counts["same"] += 1
                      else:
                          delta = ((c_heap - b_heap) / b_heap) * 100
                          if delta < -1.0:
                              status = "BETTER"
                              mem_counts["better"] += 1
                          elif delta > 1.0:
                              status = "WORSE"
                              mem_counts["worse"] += 1
                          else:
                              status = "~same"
                              mem_counts["same"] += 1
                      mem_rows.append((name, b_heap, c_heap, delta, status))

                  if mem_rows:
                      lines.append("#### Memory Comparison\n")
                      mparts = []
                      if mem_counts["better"]:
                          mparts.append(f"{mem_counts['better']} improved")
                      if mem_counts["worse"]:
                          mparts.append(
                              f"⚠️ **{mem_counts['worse']} "
                              f"regressions**"
                          )
                      else:
                          mparts.append("0 regressions")
                      if mem_counts["same"]:
                          mparts.append(f"{mem_counts['same']} unchanged")
                      lines.append("**Memory**: " + ", ".join(mparts) + "\n")
                      lines.append(
                          "| Type | Baseline | Current | Delta | Status |"
                      )
                      lines.append(
                          "|------|----------|---------|------:|--------|"
                      )
                      for name, b_heap, c_heap, delta, status in mem_rows:
                          if abs(delta) < 0.05:
                              d_str = "0.0%"
                          else:
                              d_str = f"{delta:+.1f}%"
                          if status == "BETTER":
                              s_str = "✅ **BETTER**"
                          elif status == "WORSE":
                              s_str = "⚠️ **WORSE**"
                          else:
                              s_str = "~same"
                          lines.append(
                              f"| {name} | {fmt_bytes(b_heap)} "
                              f"| {fmt_bytes(c_heap)} | {d_str} | {s_str} |"
                          )
                      lines.append("")

                  for label, entries in (
                      ("new benchmarks (not in baseline)", compare.get("new", {})),
                      ("removed benchmarks", compare.get("removed", {})),
                  ):
                      if entries:
                          lines.append(
                              f"<details><summary>{len(entries)} {label}"
                              f"</summary>\n"
                          )
                          lines.append("| Benchmark | Median |")
                          lines.append("|-----------|--------|")
                          for n, ms in sorted(entries.items()):
                              lines.append(f"| {n} | {fmt_ms(ms)} |")
                          lines.append("")
                          lines.append("</details>\n")

              # Fallback: committed baseline file. Only reached when the
              # interleaved comparison artifact is missing (e.g. the 8.4 job
              # failed before producing it).
              baseline = None
              baseline_source = None
              if compare is None:
                  fallback = "baselines/latest.json"
                  if os.path.isfile(fallback):
                      with open(fallback) as f:
                          try:
                              baseline = json.load(f)
                              baseline_source = "committed"
                          except json.JSONDecodeError:
                              pass

              if baseline and baseline.get("benchmarks"):
                  base_bm = baseline["benchmarks"]
                  base_ver = baseline.get("metadata", {}).get(
                      "judy_version", "?"
                  )

                  # Pick current data: primary platform, latest PHP
                  cur_data = bench_json.get((primary, latest), {})
                  cur_bm = cur_data.get("benchmarks", {})
                  cur_ver = cur_data.get("metadata", {}).get(
                      "judy_version", "?"
                  )

                  if cur_bm:
                      threshold = 10.0
                      min_ms = 2.0  # ignore sub-2ms timings (noise)
                      all_ids = sorted(
                          set(list(base_bm.keys()) + list(cur_bm.keys()))
                      )

                      comparisons = []
                      new_entries = []
                      removed_entries = []
                      counts = {
                          "faster": 0, "slower": 0, "same": 0,
                          "new": 0, "removed": 0,
                      }

                      for bid in all_ids:
                          # Only compare .judy entries (Judy's own perf)
                          if not bid.endswith(".judy"):
                              continue
                          # Skip heap-only entries
                          b_entry = base_bm.get(bid, {})
                          c_entry = cur_bm.get(bid, {})
                          if (b_entry.get("median_ms", 0) == 0
                              and b_entry.get("heap_bytes")):
                              continue
                          if (c_entry.get("median_ms", 0) == 0
                              and c_entry.get("heap_bytes")):
                              continue

                          b_ms = b_entry.get("median_ms")
                          c_ms = c_entry.get("median_ms")

                          # Short display name: strip .judy suffix
                          name = bid[:-5]

                          if b_ms is None and c_ms is not None:
                              new_entries.append((name, c_ms))
                              counts["new"] += 1
                          elif b_ms is not None and c_ms is None:
                              removed_entries.append((name, b_ms))
                              counts["removed"] += 1
                          elif b_ms is not None and c_ms is not None:
                              if b_ms <= 0:
                                  delta_pct = 0.0
                                  status = "~same"
                              elif b_ms < min_ms and c_ms < min_ms:
                                  # Sub-threshold: too small to compare
                                  delta_pct = 0.0
                                  status = "~same"
                                  counts["same"] += 1
                              else:
                                  delta_pct = (
                                      (c_ms - b_ms) / b_ms
                                  ) * 100
                                  if delta_pct < -threshold:
                                      status = "FASTER"
                                      counts["faster"] += 1
                                  elif delta_pct > threshold:
                                      status = "SLOWER"
                                      counts["slower"] += 1
                                  else:
                                      status = "~same"
                                      counts["same"] += 1
                              comparisons.append(
                                  (name, b_ms, c_ms, delta_pct, status)
                              )

                      # Emit section
                      lines.append(
                          f"### Release Comparison "
                          f"({base_ver} \u2192 {cur_ver})\n"
                      )
                      lines.append(
                          f"> \u26a0\ufe0f Fallback comparison — the "
                          f"interleaved same-runner artifact was missing, so "
                          f"this is v{base_ver} from the committed baseline "
                          f"file: cross-architecture, one sample per arm, no "
                          f"confidence intervals. Treat the deltas as "
                          f"unreliable. "
                          f"Threshold: \u00b1{threshold:.0f}% "
                          f"(entries < {min_ms:.0f} ms ignored).\n"
                      )
                      # Summary line
                      parts = []
                      if counts["faster"]:
                          parts.append(
                              f"{counts['faster']} faster"
                          )
                      if counts["slower"]:
                          parts.append(
                              f"\u26a0\ufe0f **{counts['slower']} "
                              f"regressions**"
                          )
                      else:
                          parts.append("0 regressions")
                      if counts["same"]:
                          parts.append(
                              f"{counts['same']} unchanged"
                          )
                      if counts["new"]:
                          parts.append(f"{counts['new']} new")
                      if counts["removed"]:
                          parts.append(
                              f"{counts['removed']} removed"
                          )
                      lines.append(
                          "**Summary**: " + ", ".join(parts) + "\n"
                      )

                      # Comparison table (only changed + same)
                      if comparisons:
                          lines.append(
                              "| Benchmark | Baseline | Current "
                              "| Delta | Status |"
                          )
                          lines.append(
                              "|-----------|----------|---------|"
                              "------:|--------|"
                          )
                          for name, b_ms, c_ms, delta, status in comparisons:
                              b_str = fmt_ms(b_ms)
                              c_str = fmt_ms(c_ms)
                              if abs(delta) < 0.05:
                                  d_str = "0.0%"
                              elif delta > 0:
                                  d_str = f"+{delta:.1f}%"
                              else:
                                  d_str = f"{delta:.1f}%"
                              if status == "FASTER":
                                  s_str = "\u2705 **FASTER**"
                              elif status == "SLOWER":
                                  s_str = "\u26a0\ufe0f **SLOWER**"
                              else:
                                  s_str = "~same"
                              lines.append(
                                  f"| {name} | {b_str} | {c_str} "
                                  f"| {d_str} | {s_str} |"
                              )
                          lines.append("")

                      # ── Memory Comparison ──
                      mem_rows = []
                      mem_counts = {
                          "better": 0, "worse": 0, "same": 0,
                      }
                      mem_fields_used = set()
                      type_label_map = dict(all_types)

                      for bid in all_ids:
                          if not bid.endswith(".heap.judy"):
                              continue
                          bid_parts = bid.split(".")
                          if len(bid_parts) < 4:
                              continue
                          # Prefer the footprint (peak RSS) over the emalloc
                          # heap, but only when BOTH sides carry it — mixing
                          # instruments across the two arms would manufacture a
                          # delta out of nothing. Stored baselines predating
                          # issue #172 have heap_bytes only, so this keeps
                          # comparing that until the baseline is next bumped.
                          b_e = base_bm.get(bid, {})
                          c_e = cur_bm.get(bid, {})
                          mem_field = ("rss_bytes"
                                       if b_e.get("rss_bytes") is not None
                                       and c_e.get("rss_bytes") is not None
                                       else "heap_bytes")
                          b_heap = b_e.get(mem_field)
                          c_heap = c_e.get(mem_field)
                          if (b_heap is None
                                  or c_heap is None):
                              continue
                          mem_fields_used.add(mem_field)
                          tid = bid_parts[1]
                          name = type_label_map.get(
                              tid, tid
                          )
                          if b_heap <= 0:
                              delta = 0.0
                              status = "~same"
                              mem_counts["same"] += 1
                          else:
                              delta = (
                                  (c_heap - b_heap)
                                  / b_heap
                              ) * 100
                              if delta < -1.0:
                                  status = "BETTER"
                                  mem_counts["better"] += 1
                              elif delta > 1.0:
                                  status = "WORSE"
                                  mem_counts["worse"] += 1
                              else:
                                  status = "~same"
                                  mem_counts["same"] += 1
                          mem_rows.append(
                              (name, b_heap, c_heap,
                               delta, status)
                          )

                      if mem_rows:
                          lines.append(
                              "#### Memory Comparison\n"
                          )
                          if mem_fields_used == {"heap_bytes"}:
                              lines.append(
                                  "Compared on the emalloc heap only: the stored "
                                  "baseline predates the peak-RSS footprint "
                                  "measurement (issue #172), so these rows track "
                                  "PHP-heap pressure, not the size of the Judy "
                                  "index. Meaningful for the zval-storing types; "
                                  "a flat ~160 B for `Bitset` and `Int to Int`, "
                                  "which is the wrapper object and nothing else.\n"
                              )
                          mparts = []
                          if mem_counts["better"]:
                              mparts.append(
                                  f"{mem_counts['better']} "
                                  f"improved"
                              )
                          if mem_counts["worse"]:
                              mparts.append(
                                  f"\u26a0\ufe0f "
                                  f"**{mem_counts['worse']} "
                                  f"regressions**"
                              )
                          else:
                              mparts.append(
                                  "0 regressions"
                              )
                          if mem_counts["same"]:
                              mparts.append(
                                  f"{mem_counts['same']} "
                                  f"unchanged"
                              )
                          lines.append(
                              "**Memory**: "
                              + ", ".join(mparts)
                              + "\n"
                          )
                          lines.append(
                              "| Type | Baseline | Current "
                              "| Delta | Status |"
                          )
                          lines.append(
                              "|------|----------|---------|"
                              "------:|--------|"
                          )
                          for (name, b_heap, c_heap,
                               delta, status) in mem_rows:
                              b_str = fmt_bytes(b_heap)
                              c_str = fmt_bytes(c_heap)
                              if abs(delta) < 0.05:
                                  d_str = "0.0%"
                              elif delta > 0:
                                  d_str = f"+{delta:.1f}%"
                              else:
                                  d_str = f"{delta:.1f}%"
                              if status == "BETTER":
                                  s_str = (
                                      "\u2705 **BETTER**"
                                  )
                              elif status == "WORSE":
                                  s_str = (
                                      "\u26a0\ufe0f **WORSE**"
                                  )
                              else:
                                  s_str = "~same"
                              lines.append(
                                  f"| {name} | {b_str} "
                                  f"| {c_str} "
                                  f"| {d_str} | {s_str} |"
                              )
                          lines.append("")

                      # Collapsible: new benchmarks
                      if new_entries:
                          lines.append(
                              f"<details><summary>"
                              f"{counts['new']} new benchmarks "
                              f"(not in baseline)</summary>\n"
                          )
                          lines.append(
                              "| Benchmark | Current |"
                          )
                          lines.append("|-----------|---------|")
                          for name, c_ms in new_entries:
                              lines.append(
                                  f"| {name} | {fmt_ms(c_ms)} |"
                              )
                          lines.append("")
                          lines.append("</details>\n")

                      # Collapsible: removed benchmarks
                      if removed_entries:
                          lines.append(
                              f"<details><summary>"
                              f"{counts['removed']} removed benchmarks"
                              f"</summary>\n"
                          )
                          lines.append(
                              "| Benchmark | Baseline |"
                          )
                          lines.append("|-----------|----------|")
                          for name, b_ms in removed_entries:
                              lines.append(
                                  f"| {name} | {fmt_ms(b_ms)} |"
                              )
                          lines.append("")
                          lines.append("</details>\n")

              # ── Collapsible raw benchmark output ──
              lines.append("<details><summary>Full benchmark output</summary>\n")
              for platform in platforms:
                  versions = sorted(
                      [v for p, v in bench_text.keys() if p == platform],
                      key=lambda v: [int(x) for x in v.split(".")]
                  )
                  if versions:
                      p_latest = versions[-1]
                      text = bench_text.get((platform, p_latest), "")
                      if text:
                          lines.append(f"#### {platform} \u2014 PHP {p_latest}\n")
                          lines.append("```")
                          lines.append(text)
                          lines.append("```\n")
              lines.append("</details>\n")

          report = "\n".join(lines) + "\n"

          with open("report.md", "w") as f:
              f.write(report)

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(report)
          PYEOF

      - name: Post PR comment
        # Fork PRs run with a read-only GITHUB_TOKEN, so commenting fails
        # with "Resource not accessible by integration"; the report is
        # still available in the job summary for those. Non-blocking so
        # report-posting issues never fail the run after tests pass.
        if: github.event_name == 'pull_request' && !github.event.pull_request.head.repo.fork
        continue-on-error: true
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('report.md', 'utf8');
            const marker = '<!-- ci-consolidated-results -->';
            const fullBody = marker + '\n' + body;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body && c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }
